[project]
name = "machine-learning-algorithms"
version = "0.1.0"
description = "Machine-learning algorithms implemented from first principles with NumPy."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "GPL-3.0-only"
authors = [
    { name = "Diogo Ribeiro" },
]
keywords = [
    "machine-learning",
    "numpy",
    "algorithms",
    "education",
    "from-scratch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0,<3.0",
]

[project.urls]
Repository = "https://github.com/DiogoRibeiro7/Machine-Learning-Algorithms"
Issues = "https://github.com/DiogoRibeiro7/Machine-Learning-Algorithms/issues"
Documentation = "https://diogoribeiro7.github.io/Machine-Learning-Algorithms/"

[tool.poetry]
packages = [
    { include = "ml_algorithms", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.16"
mypy = ">=1.13"
pre-commit = ">=4.6"
hypothesis = ">=6.0"
pytest-cov = ">=7.0"

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.6"
mkdocstrings = { version = ">=0.30", extras = ["python"] }

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

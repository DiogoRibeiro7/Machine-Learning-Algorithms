name: Release check

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-check:
    name: Validate release metadata
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate version alignment
        run: python scripts/check_release.py --tag "$RELEASE_TAG"

      - name: Build release artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
